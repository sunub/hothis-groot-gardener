name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, Lint, Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run typecheck, lint, tests, and production build
        run: npm run check

      - name: Verify security headers and route smoke checks
        run: |
          set -euo pipefail
          npx next start -H 127.0.0.1 -p 3101 apps/web > /tmp/next-ci.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:3101/ > /dev/null; then
              break
            fi
            sleep 0.5
          done

          node -e '
            const routes = ["/", "/mission", "/sources", "/design-system"];
            const required = [
              ["content-security-policy", /default-src '\''self'\''/],
              ["x-frame-options", /^DENY$/i],
              ["x-content-type-options", /^nosniff$/i],
              ["referrer-policy", /strict-origin-when-cross-origin/i],
              ["permissions-policy", /camera=\(\)/],
              ["strict-transport-security", /max-age=63072000/],
            ];
            (async () => {
              for (const route of routes) {
                const res = await fetch(`http://127.0.0.1:3101${route}`);
                if (res.status !== 200) {
                  throw new Error(`${route} returned HTTP ${res.status}`);
                }
                if (res.headers.get("x-powered-by")) {
                  throw new Error(`${route} leaked x-powered-by header`);
                }
                for (const [name, pattern] of required) {
                  const val = res.headers.get(name);
                  if (!val || !pattern.test(val)) {
                    throw new Error(`${route} missing/invalid ${name}: ${val}`);
                  }
                }
                console.log(`OK ${route} (200, 6/6 security headers)`);
              }
            })().catch((err) => {
              console.error(err);
              process.exit(1);
            });
          '

  audit:
    name: Dependency Audit (prod)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Audit production dependencies for high/critical advisories
        run: npm audit --omit=dev --audit-level=high

  lighthouse:
    name: Lighthouse CI (Accessibility & CWV)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production app
        run: npm run build

      - name: Run Lighthouse CI against local production server
        run: |
          set -euo pipefail
          npx next start -H 127.0.0.1 -p 3101 apps/web > /tmp/next-lhci.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:3101/ > /dev/null; then
              break
            fi
            sleep 0.5
          done

          npx --yes @lhci/cli@0.15.1 collect \
            --url=http://127.0.0.1:3101/ \
            --url=http://127.0.0.1:3101/sources \
            --numberOfRuns=1 \
            --settings.chromeFlags="--no-sandbox --headless=new"

          npx --yes @lhci/cli@0.15.1 assert \
            --assertions.categories:accessibility='["error", {"minScore": 0.95}]' \
            --assertions.cumulative-layout-shift='["warn", {"maxNumericValue": 0.1}]' \
            --assertions.largest-contentful-paint='["warn", {"maxNumericValue": 2500}]'
